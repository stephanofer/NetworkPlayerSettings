file-version: 2

name:
  default: "#102018Chat Styles #8c8c8c(%page%/%max-page%)"
  locales:
    es: "#102018Estilos de chat #8c8c8c(%page%/%max-page%)"
    en: "#102018Chat Styles #8c8c8c(%page%/%max-page%)"
size: 54

fillItem:
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  preview:
    slot: 4
    item:
      material: WRITABLE_BOOK
      name:
        default: "#80ffdbChat Preview"
        locales:
          es: "#80ffdbVista previa de chat"
          en: "#80ffdbChat Preview"
      lore:
        default:
          - "#8c8c8cCurrent#8c8c8c: #92ffff%playersettings_chat_style_id%"
          - "#8c8c8cActive#8c8c8c: #92ffff%playersettings_chat_preview%"
        locales:
          es:
            - "#8c8c8cActual#8c8c8c: #92ffff%playersettings_chat_style_id%"
            - "#8c8c8cActivo#8c8c8c: #92ffff%playersettings_chat_preview%"
          en:
            - "#8c8c8cCurrent#8c8c8c: #92ffff%playersettings_chat_style_id%"
            - "#8c8c8cActive#8c8c8c: #92ffff%playersettings_chat_preview%"

  styles:
    type: NPS_CHAT_STYLE
    slots:
      - 10-16
      - 19-25
      - 28-34
      - 37-43
    item:
      material: WRITABLE_BOOK
      name:
        default: "%style_selected_marker%%style_lock_marker%%style_name%"
        locales:
          es: "%style_selected_marker%%style_lock_marker%%style_name%"
          en: "%style_selected_marker%%style_lock_marker%%style_name%"
      lore:
        default:
          - "#8c8c8cCategory#8c8c8c: #92ffff%style_category%"
          - "#8c8c8cPreview#8c8c8c: #ffffff%style_preview%"
          - "#8c8c8cState#8c8c8c: #92ffff%style_state%"
          - ""
          - "#2CCED2Click #92ffff%style_action%"
        locales:
          es:
            - "#8c8c8cCategoria#8c8c8c: #92ffff%style_category%"
            - "#8c8c8cVista#8c8c8c: #ffffff%style_preview%"
            - "#8c8c8cEstado#8c8c8c: #92ffff%style_state%"
            - ""
            - "#2CCED2Click #92ffff%style_action%"
          en:
            - "#8c8c8cCategory#8c8c8c: #92ffff%style_category%"
            - "#8c8c8cPreview#8c8c8c: #ffffff%style_preview%"
            - "#8c8c8cState#8c8c8c: #92ffff%style_state%"
            - ""
            - "#2CCED2Click #92ffff%style_action%"

  previous:
    type: PREVIOUS
    slot: 47
    item:
      material: ARROW
      name:
        default: "#92ffffPrevious Page"
        locales:
          es: "#92ffffPagina anterior"
          en: "#92ffffPrevious Page"
      lore:
        default:
          - "#8c8c8cGo to page #92ffff%player_previous_page%"
        locales:
          es:
            - "#8c8c8cIr a la pagina #92ffff%player_previous_page%"
          en:
            - "#8c8c8cGo to page #92ffff%player_previous_page%"
  clear:
    type: NPS_CLEAR_CHAT_STYLE
    slot: 48
    item:
      material: BARRIER
      name:
        default: "#ff6666Clear Chat Style"
        locales:
          es: "#ff6666Quitar estilo de chat"
          en: "#ff6666Clear Chat Style"
      lore:
        default:
          - "#8c8c8cState#8c8c8c: #92ffff%clear_state%"
          - ""
          - "#2CCED2Click #92ffffto remove your active style"
        locales:
          es:
            - "#8c8c8cEstado#8c8c8c: #92ffff%clear_state%"
            - ""
            - "#2CCED2Click #92ffffpara quitar tu estilo activo"
          en:
            - "#8c8c8cState#8c8c8c: #92ffff%clear_state%"
            - ""
            - "#2CCED2Click #92ffffto remove your active style"
  back:
    type: INVENTORY
    inventory: "settings-main"
    plugin: "NetworkPlayerSettingsZMenu"
    slot: 49
    item:
      material: ARROW
      name:
        default: "#92ffffBack"
        locales:
          es: "#92ffffVolver"
          en: "#92ffffBack"
  filter:
    type: NPS_CHAT_STYLE_FILTER
    slot: 50
    item:
      material: HOPPER
      name:
        default: "#92ffffFilter: #ffffff%style_filter%"
        locales:
          es: "#92ffffFiltro: #ffffff%style_filter%"
          en: "#92ffffFilter: #ffffff%style_filter%"
      lore:
        default:
          - "#8c8c8cClick #92ffffto %style_filter_action%"
        locales:
          es:
            - "#8c8c8cClick #92ffffpara %style_filter_action%"
          en:
            - "#8c8c8cClick #92ffffto %style_filter_action%"
  next:
    type: NEXT
    slot: 51
    item:
      material: ARROW
      name:
        default: "#92ffffNext Page"
        locales:
          es: "#92ffffPagina siguiente"
          en: "#92ffffNext Page"
      lore:
        default:
          - "#8c8c8cGo to page #92ffff%player_next_page%"
        locales:
          es:
            - "#8c8c8cIr a la pagina #92ffff%player_next_page%"
          en:
            - "#8c8c8cGo to page #92ffff%player_next_page%"
