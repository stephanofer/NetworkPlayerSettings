name:
  default: "#0c1719Settings"
  locales:
    es: "#0c1719Ajustes"
    en: "#0c1719Settings"
external-title:
  default: "Global settings"
  locales:
    es: "Ajustes globales"
    en: "Global settings"
type: notice
can-close-with-escape: true
pause: false
after-action: CLOSE

actions:
  1:
    success:
      - type: inventory
        inventory: "language"
        plugin: "NetworkPlayerSettingsZMenu"

notice:
  text:
    default: "Open settings menu"
    locales:
      es: "Abrir menú de ajustes"
      en: "Open settings menu"
  tooltip:
    default: "Open your personalized NetworkPlayerSettings menu"
    locales:
      es: "Abrí tu menú personalizado de NetworkPlayerSettings"
      en: "Open your personalized NetworkPlayerSettings menu"
  width: 280
